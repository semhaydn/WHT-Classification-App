{% extends "base.html" %}
{% block title %}Sign in | WHT Classification{% endblock %}
{% block content %}
<div class="panel" style="max-width: 440px; margin: 40px auto;">
    <h1>Sign in</h1>
    <p class="subtitle">Use your local application account to record classifications.</p>
    {% if form.errors %}<p class="errorlist">Invalid username or password.</p>{% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit">Sign in</button>
    </form>
</div>
{% endblock %}
